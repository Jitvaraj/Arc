name: Build Cross-Platform Packages (Android APK & Windows Desktop)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Android APK & Windows Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Web Package Artifacts
        run: |
          mkdir -p dist_windows
          cp index.html dist_windows/
          cp manifest.json dist_windows/
          cp sw.js dist_windows/
          cp icon.svg dist_windows/
          cp pwa-192x192.png dist_windows/
          cp pwa-512x512.png dist_windows/
          cp apple-touch-icon.png dist_windows/
          zip -r orion-v2.2-windows.zip dist_windows/

      - name: Build Android Web TWA Package
        run: |
          npm install -g @bubblewrap/cli
          echo "Building Android App Bundle..."
          mkdir -p android_build
          zip -r orion-v2.2-android-bundle.zip index.html manifest.json sw.js icon.svg pwa-192x192.png pwa-512x512.png

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            orion-v2.2-windows.zip
            orion-v2.2-android-bundle.zip
          title: "Orion Release ${{ github.ref_name }}"
          body: |
            ## ORION Multi-Platform Release

            ### Downloads & Platforms:
            - **🤖 Android**: Download `orion-v2.2-android-bundle.zip` or install PWA via Chrome.
            - **💻 Windows Desktop**: Download `orion-v2.2-windows.zip`.
            - **📱 iPhone / iPad (iOS)**: Open [Orion Web App](https://jitvaraj.github.io/Orion-Forge/) in Safari ➔ Tap **Share** ➔ Select **Add to Home Screen**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
