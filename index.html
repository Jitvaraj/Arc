    // ==========================================
    // 4. QUOTE WALL
    // ==========================================
    function QuoteWallSection({ quotes, onSaveQuote, onDeleteQuote }) {
      const [activeTab, setActiveTab] = useState("all");
      const [showModal, setShowModal] = useState(false);
      const [editingQuoteId, setEditingQuoteId] = useState(null);
      const [quoteText, setQuoteText] = useState("");
      const [author, setAuthor] = useState("");
      const [rank, setRank] = useState(0);

      const rankBadges = {
        1: { name: "1st", color: "border-rankGold text-rankGold bg-rankGold/10" },
        2: { name: "2nd", color: "border-rankSilver text-rankSilver bg-rankSilver/10" },
        3: { name: "3rd", color: "border-rankBronze text-rankBronze bg-rankBronze/10" },
        4: { name: "4th", color: "border-rankLapis text-rankLapis bg-rankLapis/10" },
        5: { name: "5th", color: "border-rankRuby text-rankRuby bg-rankRuby/10" }
      };

      const openAdd = () => {
        setEditingQuoteId(null);
        setQuoteText("");
        setAuthor("");
        setRank(0);
        setShowModal(true);
      };

      const openEdit = (q) => {
        setEditingQuoteId(q.id);
        setQuoteText(q.text);
        setAuthor(q.author);
        setRank(q.rank || 0);
        setShowModal(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!quoteText) return;
        const newQuote = {
          id: editingQuoteId || ("q_" + Date.now()),
          text: quoteText,
          author: author || "Unknown",
          rank: Number(rank) || 0,
          updatedAt: new Date().toISOString()
        };
        onSaveQuote(newQuote);
        setShowModal(false);
      };

      const displayedQuotes = activeTab === "ranked"
        ? quotes.filter(q => q.rank > 0 && q.rank <= 5).sort((a,b) => a.rank - b.rank)
        : quotes;

      return (
        <div className="p-4 space-y-4">
          <div className="flex items-center justify-between">
            <h1 className="text-xl font-semibold tracking-tight">Quote Wall</h1>
            <div className="flex items-center space-x-2">
              <div className="flex bg-[#121212] p-1 rounded-lg border border-[#222222] text-xs">
                <button
                  onClick={() => setActiveTab("all")}
                  className={`px-3 py-1 rounded-md font-medium transition ${
                    activeTab === "all" ? "bg-[#222222] text-appGreen" : "text-gray-400"
                  }`}
                >
                  All
                </button>
                <button
                  onClick={() => setActiveTab("ranked")}
                  className={`px-3 py-1 rounded-md font-medium transition ${
                    activeTab === "ranked" ? "bg-[#222222] text-appGreen" : "text-gray-400"
                  }`}
                >
                  Top 5 Ranked
                </button>
              </div>
              <button
                onClick={openAdd}
                className="w-7 h-7 rounded-lg bg-appGreen text-black font-bold flex items-center justify-center text-sm"
              >
                +
              </button>
            </div>
          </div>

          <div className="space-y-3">
            {displayedQuotes.length === 0 ? (
              <p className="text-xs text-gray-500 italic text-center py-8">
                {activeTab === "ranked" ? "No ranked quotes assigned (1st-5th place)." : "No quotes saved yet."}
              </p>
            ) : (
              displayedQuotes.map(q => {
                const badge = rankBadges[q.rank];
                return (
                  <div
                    key={q.id}
                    className={`p-4 rounded-xl bg-[#121212] border transition relative ${
                      badge ? `border-l-4 ${badge.color.split(" ")[0]}` : "border-[#222222]"
                    }`}
                  >
                    <div className="flex items-start justify-between">
                      <p className="text-sm font-medium text-gray-200 leading-relaxed italic pr-4">
                        "{q.text}"
                      </p>
                      <div className="flex items-center space-x-2 shrink-0">
                        <button onClick={() => openEdit(q)} className="text-gray-400 hover:text-white text-xs">
                          Edit
                        </button>
                        <button onClick={() => onDeleteQuote(q.id)} className="text-gray-500 hover:text-red-400 text-xs">
                          ✕
                        </button>
                      </div>
                    </div>
                    <div className="flex items-center justify-between mt-3 text-xs">
                      <span className="text-gray-400 font-normal">— {q.author}</span>
                      {badge ? (
                        <span className={`px-2 py-0.5 rounded text-[10px] font-semibold border ${badge.color}`}>
                          {badge.name} Rank
                        </span>
                      ) : (
                        <span className="text-[10px] text-gray-600">Unranked</span>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {/* Add / Edit Quote Modal */}
          {showModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSave} className="bg-[#121212] border border-[#222222] rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="text-sm font-semibold text-white">{editingQuoteId ? "Edit Quote" : "Add Quote"}</h3>
                <div>
                  <label className="text-[11px] text-gray-400">Quote Text</label>
                  <textarea
                    required
                    value={quoteText}
                    onChange={(e) => setQuoteText(e.target.value)}
                    placeholder="Write the exact quote..."
                    className="w-full mt-1 p-2.5 rounded-xl bg-black border border-[#222222] text-xs text-white focus:outline-none resize-none h-20"
                  />
                </div>
                <div>
                  <label className="text-[11px] text-gray-400">Author</label>
                  <input
                    type="text"
                    value={author}
                    onChange={(e) => setAuthor(e.target.value)}
                    placeholder="e.g. Marcus Aurelius"
                    className="w-full mt-1 p-2 rounded-xl bg-black border border-[#222222] text-xs text-white focus:outline-none"
                  />
                </div>
                <div>
                  <label className="text-[11px] text-gray-400">Rank (Manual governance)</label>
                  <select
                    value={rank}
                    onChange={(e) => setRank(Number(e.target.value))}
                    className="w-full mt-1 p-2 rounded-xl bg-black border border-[#222222] text-xs text-white focus:outline-none"
                  >
                    <option value={0}>Unranked (Neutral)</option>
                    <option value={1}>1st Place (Gold)</option>
                    <option value={2}>2nd Place (Silver)</option>
                    <option value={3}>3rd Place (Bronze)</option>
                    <option value={4}>4th Place (Lapis Blue)</option>
                    <option value={5}>5th Place (Ruby Red)</option>
                  </select>
                </div>
                <div className="flex space-x-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setShowModal(false)}
                    className="flex-1 py-2 text-xs rounded-lg border border-[#222222] text-gray-400"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2 text-xs rounded-lg bg-appGreen text-black font-semibold"
                  >
                    Save
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 5. NOTES SECTION
    // ==========================================
    function NotesSection({ notes, onSaveNote, onDeleteNote }) {
      const [search, setSearch] = useState("");
      const [showModal, setShowModal] = useState(false);
      const [editingNoteId, setEditingNoteId] = useState(null);
      const [title, setTitle] = useState("");
      const [content, setContent] = useState("");

      const filteredNotes = notes.filter(n =>
        n.title.toLowerCase().includes(search.toLowerCase()) ||
        n.content.toLowerCase().includes(search.toLowerCase())
      );

      const openAdd = () => {
        setEditingNoteId(null);
        setTitle("");
        setContent("");
        setShowModal(true);
      };

      const openEdit = (n) => {
        setEditingNoteId(n.id);
        setTitle(n.title);
        setContent(n.content);
        setShowModal(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!title && !content) return;
        const newNote = {
          id: editingNoteId || ("n_" + Date.now()),
          title: title || "Untitled Note",
          content,
          createdAt: new Date().toISOString()
        };
        onSaveNote(newNote);
        setShowModal(false);
      };

      return (
        <div className="p-4 space-y-4">
          <div className="flex items-center justify-between">
            <h1 className="text-xl font-semibold tracking-tight">Notes</h1>
            <button
              onClick={openAdd}
              className="px-3 py-1 text-xs rounded-lg bg-appGreen text-black font-semibold hover:bg-green-400 transition"
            >
              + New Note
            </button>
          </div>

          <input
            type="text"
            placeholder="Search notes..."
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            className="w-full p-2.5 rounded-xl bg-[#121212] border border-[#222222] text-xs text-white focus:outline-none"
          />

          <div className="space-y-2.5">
            {filteredNotes.length === 0 ? (
              <p className="text-xs text-gray-500 italic text-center py-8">No notes found.</p>
            ) : (
              filteredNotes.map(note => (
                <div key={note.id} className="p-4 rounded-xl bg-[#121212] border border-[#222222] space-y-1 relative">
                  <div className="flex items-center justify-between">
                    <h3 className="text-sm font-semibold text-white">{note.title}</h3>
                    <div className="flex items-center space-x-2">
                      <button onClick={() => openEdit(note)} className="text-gray-400 hover:text-white text-xs">
                        Edit
                      </button>
                      <button onClick={() => onDeleteNote(note.id)} className="text-gray-500 hover:text-red-400 text-xs">
                        ✕
                      </button>
                    </div>
                  </div>
                  <p className="text-xs text-gray-300 whitespace-pre-wrap leading-relaxed">{note.content}</p>
                  <p className="text-[10px] text-gray-500 pt-1">
                    {new Date(note.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}
                  </p>
                </div>
              ))
            )}
          </div>

          {showModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSave} className="bg-[#121212] border border-[#222222] rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="text-sm font-semibold text-white">{editingNoteId ? "Edit Note" : "Create Note"}</h3>
                <input
                  type="text"
                  placeholder="Note Title"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full p-2.5 rounded-xl bg-black border border-[#222222] text-xs text-white focus:outline-none"
                />
                <textarea
                  placeholder="Note content..."
                  value={content}
                  onChange={(e) => setContent(e.target.value)}
                  className="w-full h-32 p-2.5 rounded-xl bg-black border border-[#222222] text-xs text-white focus:outline-none resize-none"
                />
                <div className="flex space-x-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setShowModal(false)}
                    className="flex-1 py-2 text-xs rounded-lg border border-[#222222] text-gray-400"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2 text-xs rounded-lg bg-appGreen text-black font-semibold"
                  >
                    Save
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. EXAM MARKS SECTION (Matches Screenshot 2)
    // ==========================================
    function ExamMarksSection({ exams, onAddExam, onDeleteExam }) {
      const [category, setCategory] = useState("Coaching Exams");
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingExam, setEditingExam] = useState(null);
      const [selectedExamDetails, setSelectedExamDetails] = useState(null);
      const [showDetailedAnalysis, setShowDetailedAnalysis] = useState(false);

      const categoryExams = useMemo(() => {
        return exams.filter(e => e.category === category);
      }, [exams, category]);

      const stats = useMemo(() => {
        if (categoryExams.length === 0) {
          return { overallPct: 0, highestPct: 0, totalExams: 0 };
        }
        let totalObt = 0;
        let totalMax = 0;
        let highest = 0;

        categoryExams.forEach(ex => {
          let exObt = 0;
          let exMax = 0;
          ex.subjects.forEach(s => {
            exObt += Number(s.obtained) || 0;
            exMax += Number(s.maxMarks) || 0;
          });
          const pct = exMax > 0 ? (exObt / exMax) * 100 : 0;
          if (pct > highest) highest = pct;
          totalObt += exObt;
          totalMax += exMax;
        });

        const overallPct = totalMax > 0 ? (totalObt / totalMax) * 100 : 0;
        return {
          overallPct,
          highestPct: highest,
          totalExams: categoryExams.length
        };
      }, [categoryExams]);

      return (
        <div className="p-4 space-y-4">
          {/* Header Title */}
          <div className="flex items-center justify-between">
            <h1 className="text-xl font-semibold tracking-tight">Exam Marks</h1>
            <button
              onClick={() => {
                setEditingExam(null);
                setShowAddModal(true);
              }}
              className="px-3 py-1 rounded-lg bg-appGreen text-black font-semibold text-xs hover:bg-green-400 transition"
            >
              + Add Result
            </button>
          </div>

          {/* Segmented Switcher (Matches Screenshot 2) */}
          <div className="grid grid-cols-2 bg-[#121212] p-1 rounded-xl border border-[#222222] text-xs font-medium">
            <button
              onClick={() => setCategory("Coaching Exams")}
              className={`py-2 rounded-lg transition ${
                category === "Coaching Exams"
                  ? "bg-[#222222] text-appGreen font-semibold"
                  : "text-gray-400 hover:text-white"
              }`}
            >
              Coaching Exams
            </button>
            <button
              onClick={() => setCategory("Tuition Exams")}
              className={`py-2 rounded-lg transition ${
                category === "Tuition Exams"
                  ? "bg-[#222222] text-appGreen font-semibold"
                  : "text-gray-400 hover:text-white"
              }`}
            >
              Tuition Exams
            </button>
          </div>

          {/* Summary Metric Card */}
          <div className="p-4 rounded-2xl bg-[#121212] border border-[#222222]">
            <div className="flex items-center justify-between">
              <div className="flex items-center space-x-3.5">
                <CircularProgress percentage={stats.overallPct} size={76} strokeWidth={6} />
                <div>
                  <p className="text-xs text-gray-400">{category} Overall</p>
                  <p className="text-2xl font-bold text-white tracking-tight">
                    {stats.overallPct.toFixed(1)}%
                  </p>
                  <p className="text-[10px] text-gray-500">Avg. of all {category.toLowerCase()}</p>
                </div>
              </div>

              <div className="space-y-3 pl-3 border-l border-[#222222]">
                <div>
                  <p className="text-[10px] text-gray-400">🏆 Highest</p>
                  <p className="text-sm font-semibold text-white">{stats.highestPct.toFixed(1)}%</p>
                </div>
                <div>
                  <p className="text-[10px] text-gray-400">📊 Total Exams</p>
                  <p className="text-sm font-semibold text-white">{stats.totalExams}</p>
                </div>
              </div>
            </div>
          </div>

          {/* Recent Exams List */}
          <div className="space-y-2.5">
            <div className="flex items-center justify-between text-xs text-gray-400">
              <span className="font-semibold uppercase tracking-wider text-[11px]">Recent {category}</span>
              <span>{categoryExams.length} recorded</span>
            </div>

            {categoryExams.length === 0 ? (
              <div className="p-8 text-center bg-[#121212] rounded-xl border border-[#222222]">
                <p className="text-xs text-gray-500 italic">No exams recorded for {category}.</p>
                <p className="text-[11px] text-gray-600 mt-1">Tap "+ Add Result" above to add real data.</p>
              </div>
            ) : (
              categoryExams.map(ex => {
                let exObt = 0;
                let exMax = 0;
                ex.subjects.forEach(s => {
                  exObt += Number(s.obtained) || 0;
                  exMax += Number(s.maxMarks) || 0;
                });
                const examPct = exMax > 0 ? (exObt / exMax) * 100 : 0;

                return (
                  <div
                    key={ex.id}
                    onClick={() => setSelectedExamDetails(ex)}
                    className="p-3.5 rounded-xl bg-[#121212] border border-[#222222] hover:border-gray-600 cursor-pointer transition flex items-center justify-between"
                  >
                    <div className="space-y-1 pr-3">
                      <div className="flex items-center space-x-2">
                        <span className="text-sm font-medium text-white">{ex.name}</span>
                      </div>
                      <p className="text-[10px] text-gray-400">{ex.date}</p>
                      <p className="text-[11px] text-gray-300 font-mono tracking-tight line-clamp-1">
                        {ex.subjects.map(s => `${s.name}: ${s.obtained}/${s.maxMarks}`).join(" | ")}
                      </p>
                    </div>

                    <div className="flex items-center space-x-2 shrink-0">
                      <span className="text-sm font-semibold text-appGreen font-mono">
                        {examPct.toFixed(1)}%
                      </span>
                      <span className="text-gray-500 text-xs">›</span>
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {/* View Detailed Analysis Button (Matches Screenshot 2) */}
          {categoryExams.length > 0 && (
            <button
              onClick={() => setShowDetailedAnalysis(true)}
              className="w-full py-3 rounded-xl border border-appGreen/40 bg-appGreenSubtle/20 text-appGreen text-xs font-semibold hover:bg-appGreenSubtle transition flex items-center justify-center space-x-2"
            >
              <span>📊 View Detailed Analysis</span>
              <span>›</span>
            </button>
          )}

          {/* Add / Edit Exam Modal */}
          {showAddModal && (
            <AddExamModal
              category={category}
              existingExam={editingExam}
              onClose={() => {
                setShowAddModal(false);
                setEditingExam(null);
              }}
              onSave={(newExam) => {
                onAddExam(newExam);
                setShowAddModal(false);
                setEditingExam(null);
              }}
            />
          )}

          {/* Exam Details Modal */}
          {selectedExamDetails && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#121212] border border-[#222222] rounded-2xl p-5 max-w-sm w-full space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-[#222222] pb-2">
                  <div>
                    <h3 className="text-sm font-semibold text-white">{selectedExamDetails.name}</h3>
                    <p className="text-[11px] text-gray-400">{selectedExamDetails.category} • {selectedExamDetails.date}</p>
                  </div>
                  <button onClick={() => setSelectedExamDetails(null)} className="text-gray-400 hover:text-white text-xs">✕</button>
                </div>

                <div className="space-y-2">
                  <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Subject Breakdown</p>
                  {selectedExamDetails.subjects.map((sub, idx) => {
                    const subPct = sub.maxMarks > 0 ? ((sub.obtained / sub.maxMarks) * 100).toFixed(1) : 0;
                    return (
                      <div key={idx} className="flex items-center justify-between text-xs p-2 rounded-lg bg-black border border-[#222222]">
                        <span className="font-medium text-gray-200">{sub.name}</span>
                        <span className="font-mono text-gray-300">
                          {sub.obtained} / {sub.maxMarks} <span className="text-appGreen ml-1">({subPct}%)</span>
                        </span>
                      </div>
                    );
                  })}
                </div>

                {selectedExamDetails.notes && (
                  <div>
                    <p className="text-[11px] text-gray-400">Notes:</p>
                    <p className="text-xs text-gray-300 italic">{selectedExamDetails.notes}</p>
                  </div>
                )}

                <div className="flex space-x-2 pt-2">
                  <button
                    onClick={() => {
                      setEditingExam(selectedExamDetails);
                      setSelectedExamDetails(null);
                      setShowAddModal(true);
                    }}
                    className="flex-1 py-2 text-xs rounded-lg bg-[#222222] text-white font-medium"
                  >
                    Edit Exam
                  </button>
                  <button
                    onClick={() => {
                      if (confirm("Delete this examination record?")) {
                        onDeleteExam(selectedExamDetails.id);
                        setSelectedExamDetails(null);
                      }
                    }}
                    className="flex-1 py-2 text-xs rounded-lg border border-red-500/40 text-red-400 hover:bg-red-950/20"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Detailed Analysis Modal */}
          {showDetailedAnalysis && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#121212] border border-[#222222] rounded-2xl p-5 max-w-sm w-full space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-[#222222] pb-2">
                  <h3 className="text-sm font-semibold text-white">Analysis: {category}</h3>
                  <button onClick={() => setShowDetailedAnalysis(false)} className="text-gray-400 hover:text-white text-xs">✕</button>
                </div>
                
                <div className="space-y-3">
                  {categoryExams.map(ex => {
                    let exObt = 0;
                    let exMax = 0;
                    ex.subjects.forEach(s => {
                      exObt += Number(s.obtained) || 0;
                      exMax += Number(s.maxMarks) || 0;
                    });
                    const pct = exMax > 0 ? (exObt / exMax) * 100 : 0;
                    return (
                      <div key={ex.id} className="p-3 rounded-xl bg-black border border-[#222222] space-y-2">
                        <div className="flex justify-between text-xs">
                          <span className="font-semibold text-white">{ex.name}</span>
                          <span className="font-mono text-appGreen font-bold">{pct.toFixed(1)}%</span>
                        </div>
                        <div className="w-full bg-[#222222] h-2 rounded-full overflow-hidden">
                          <div className="bg-appGreen h-full rounded-full transition-all" style={{ width: `${pct}%` }}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <button
                  onClick={() => setShowDetailedAnalysis(false)}
                  className="w-full py-2 text-xs rounded-lg bg-appGreen text-black font-semibold"
                >
                  Close
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Add/Edit Exam Modal Helper ---
    function AddExamModal({ category, existingExam, onClose, onSave }) {
      const [name, setName] = useState(existingExam ? existingExam.name : "");
      const [date, setDate] = useState(existingExam ? existingExam.date : formatDateKey(new Date()));
      const [notes, setNotes] = useState(existingExam ? existingExam.notes : "");
      const [subjects, setSubjects] = useState(
        existingExam ? existingExam.subjects : [
          { name: "Physics", obtained: "", maxMarks: "100" },
          { name: "Maths", obtained: "", maxMarks: "100" }
        ]
      );

      const updateSubject = (index, field, value) => {
        setSubjects(prev => {
          const copy = [...prev];
          copy[index][field] = value;
          return copy;
        });
      };

      const addSubjectRow = () => {
        setSubjects(prev => [...prev, { name: "", obtained: "", maxMarks: "100" }]);
      };

      const removeSubjectRow = (index) => {
        if (subjects.length === 1) return;
        setSubjects(prev => prev.filter((_, i) => i !== index));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name) return;
        const examRecord = {
          id: existingExam ? existingExam.id : ("ex_" + Date.now()),
          category,
          name,
          date,
          notes,
          subjects: subjects.map(s => ({
            name: s.name || "Subject",
            obtained: Number(s.obtained) || 0,
            maxMarks: Number(s.maxMarks) || 100
          }))
        };
        onSave(examRecord);
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="bg-[#121212] border border-[#222222] rounded-2xl p-5 max-w-sm w-full space-y-3 max-h-[85vh] overflow-y-auto">
            <h3 className="text-sm font-semibold text-white">{existingExam ? "Edit" : "Record"} {category}</h3>

            <div>
              <label className="text-[11px] text-gray-400">Exam Title</label>
              <input
                type="text"
                required
                placeholder="e.g. JEE Mock Test 1"
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="w-full mt-1 p-2 rounded-xl bg-black border border-[#222222] text-xs text-white focus:outline-none"
              />
            </div>

            <div>
              <label className="text-[11px] text-gray-400">Date</label>
              <input
                type="date"
                value={date}
                onChange={(e) => setDate(e.target.value)}
                className="w-full mt-1 p-2 rounded-xl bg-black border border-[#222222] text-xs text-white focus:outline-none"
              />
            </div>

            <div className="space-y-2 pt-1">
              <div className="flex items-center justify-between">
                <label className="text-[11px] text-gray-400 font-semibold">Subjects & Marks</label>
                <button type="button" onClick={addSubjectRow} className="text-xs text-appGreen font-medium">
                  + Add Subject
                </button>
              </div>

              {subjects.map((sub, idx) => (
                <div key={idx} className="flex items-center space-x-1.5">
                  <input
                    type="text"
                    placeholder="Subject"
                    value={sub.name}
                    onChange={(e) => updateSubject(idx, "name", e.target.value)}
                    className="flex-1 p-2 rounded-lg bg-black border border-[#222222] text-xs text-white focus:outline-none"
                  />
                  <input
                    type="number"
                    placeholder="Obt"
                    value={sub.obtained}
                    onChange={(e) => updateSubject(idx, "obtained", e.target.value)}
                    className="w-16 p-2 rounded-lg bg-black border border-[#222222] text-xs text-white focus:outline-none text-center"
                  />
                  <span className="text-gray-500 text-xs">/</span>
                  <input
                    type="number"
                    placeholder="Max"
                    value={sub.maxMarks}
                    onChange={(e) => updateSubject(idx, "maxMarks", e.target.value)}
                    className="w-16 p-2 rounded-lg bg-black border border-[#222222] text-xs text-white focus:outline-none text-center"
                  />
                  <button type="button" onClick={() => removeSubjectRow(idx)} className="text-gray-500 hover:text-red-400 text-xs p-1">
                    ✕
                  </button>
                </div>
              ))}
            </div>

            <div>
              <label className="text-[11px] text-gray-400">Notes (optional)</label>
              <input
                type="text"
                placeholder="Time management, silly mistakes..."
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                className="w-full mt-1 p-2 rounded-xl bg-black border border-[#222222] text-xs text-white focus:outline-none"
              />
            </div>

            <div className="flex space-x-2 pt-2">
              <button
                type="button"
                onClick={onClose}
                className="flex-1 py-2 text-xs rounded-lg border border-[#222222] text-gray-400"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="flex-1 py-2 text-xs rounded-lg bg-appGreen text-black font-semibold"
              >
                Save
              </button>
            </div>
          </form>
        </div>
      );
    }

    // ==========================================
    // 7. DATE JOURNAL & WORKOUT MODAL
    // ==========================================
    function DateJournalModal({ date, journalContent, scheduledForDate, onSaveJournal, onAddScheduled, onDeleteScheduled, onClose }) {
      const dateKey = formatDateKey(date);
      const [draftContent, setDraftContent] = useState(journalContent);
      const [autoSaved, setAutoSaved] = useState(false);

      const [title, setTitle] = useState("");
      const [time, setTime] = useState("07:00");
      const [details, setDetails] = useState("");

      useEffect(() => {
        setDraftContent(journalContent || "");
      }, [journalContent, dateKey]);

      useEffect(() => {
        const timer = setTimeout(() => {
          if (draftContent !== journalContent) {
            onSaveJournal(draftContent);
            setAutoSaved(true);
            setTimeout(() => setAutoSaved(false), 1200);
          }
        }, 800);
        return () => clearTimeout(timer);
      }, [draftContent]);

      const handleAddSchedule = (e) => {
        e.preventDefault();
        if (!title) return;
        const item = {
          id: "sched_" + Date.now(),
          date: dateKey,
          title,
          time,
          details
        };
        onAddScheduled(item);
        setTitle("");
        setDetails("");
      };

      return (
        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-[#121212] border border-[#222222] rounded-2xl p-5 max-w-sm w-full space-y-4 max-h-[85vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-[#222222] pb-2">
              <div>
                <h3 className="text-sm font-semibold text-white">
                  {date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}
                </h3>
                <span className="text-[10px] text-gray-400">
                  {autoSaved ? "Saved automatically ✓" : "Daily journal & schedule"}
                </span>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-xs">✕</button>
            </div>

            <div className="space-y-1">
              <label className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Daily Journal</label>
              <textarea
                value={draftContent}
                onChange={(e) => setDraftContent(e.target.value)}
                placeholder="Write reflections, thoughts, or plans for this day..."
                className="w-full h-32 p-3 rounded-xl bg-black border border-[#222222] text-xs text-white focus:outline-none resize-none leading-relaxed"
              />
            </div>

            <div className="space-y-2 pt-2 border-t border-[#222222]">
              <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Scheduled Workouts</p>
              
              {scheduledForDate.length > 0 && (
                <div className="space-y-1.5 mb-2">
                  {scheduledForDate.map(s => (
                    <div key={s.id} className="p-2 rounded-lg bg-black border border-[#222222] flex items-center justify-between text-xs">
                      <div>
                        <p className="font-medium text-white">{s.title}</p>
                        <p className="text-[10px] text-gray-400">{s.time} • {s.details}</p>
                      </div>
                      <button onClick={() => onDeleteScheduled(s.id)} className="text-gray-500 hover:text-red-400 text-xs">✕</button>
                    </div>
                  ))}
                </div>
              )}

              <form onSubmit={handleAddSchedule} className="space-y-2 bg-black/40 p-3 rounded-xl border border-[#222222]">
                <input
                  type="text"
                  placeholder="Session title (e.g. Upper Body)"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full p-2 rounded-lg bg-black border border-[#222222] text-xs text-white focus:outline-none"
                />
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="time"
                    value={time}
                    onChange={(e) => setTime(e.target.value)}
                    className="w-full p-2 rounded-lg bg-black border border-[#222222] text-xs text-white focus:outline-none"
                  />
                  <input
                    type="text"
                    placeholder="Focus / notes"
                    value={details}
                    onChange={(e) => setDetails(e.target.value)}
                    className="w-full p-2 rounded-lg bg-black border border-[#222222] text-xs text-white focus:outline-none"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full py-1.5 rounded-lg bg-[#222222] hover:bg-gray-700 text-xs text-appGreen font-medium transition"
                >
                  + Add to this Date
                </button>
              </form>
            </div>

            <button
              onClick={() => {
                onSaveJournal(draftContent);
                onClose();
              }}
              className="w-full py-2 text-xs rounded-lg bg-appGreen text-black font-semibold mt-2"
            >
              Done
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. SETTINGS & BACKUP MODAL
    // ==========================================
    function SettingsModal({ onClose, onExport, onImport }) {
      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-[#121212] border border-[#222222] rounded-2xl p-5 max-w-sm w-full space-y-4">
            <div className="flex items-center justify-between border-b border-[#222222] pb-2">
              <h3 className="text-sm font-semibold text-white">Data & Privacy</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-xs">✕</button>
            </div>

            <p className="text-xs text-gray-400 leading-relaxed">
              <strong>ARC</strong> operates completely offline with IndexedDB. No accounts, telemetry, or remote servers exist.
            </p>

            <div className="space-y-2 pt-2">
              <button
                onClick={onExport}
                className="w-full py-2.5 rounded-xl bg-[#222222] text-white text-xs font-medium hover:bg-gray-800 transition"
              >
                Export Offline JSON Backup
              </button>

              <label className="w-full py-2.5 rounded-xl border border-[#222222] text-gray-300 text-xs font-medium hover:bg-[#222222] transition flex items-center justify-center cursor-pointer">
                <span>Restore Backup File</span>
                <input
                  type="file"
                  accept=".json"
                  onChange={onImport}
                  className="hidden"
                />
              </label>
            </div>

            <p className="text-[10px] text-gray-600 text-center">Version 1.1.0 • Mobile-first Architecture</p>
          </div>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
