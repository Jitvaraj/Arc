    // ==========================================
    // 6. EXAM MARKS DASHBOARD 2.1 (SCHOOL & COACHING)
    // ==========================================
    function ExamMarksSection({ exams, onAddExam, onDeleteExam }) {
      const [filter, setFilter] = useState("all"); // "all" | "School" | "Coaching"
      const [showModal, setShowModal] = useState(false);

      const calcStats = (examList) => {
        if (!examList || examList.length === 0) return { totalObt: 0, totalMax: 0, avgPct: 0, count: 0 };
        let o = 0, m = 0;
        examList.forEach(ex => {
          (ex.subjects || []).forEach(sub => {
            o += Number(sub.obtained) || 0;
            m += Number(sub.maxMarks) || 0;
          });
        });
        const pct = m > 0 ? (o / m) * 100 : 0;
        return { totalObt: o, totalMax: m, avgPct: pct, count: examList.length };
      };

      const schoolExams = useMemo(() => exams.filter(e => (e.category || "School") === "School"), [exams]);
      const coachingExams = useMemo(() => exams.filter(e => e.category === "Coaching"), [exams]);
      
      const displayedExams = useMemo(() => {
        if (filter === "School") return schoolExams;
        if (filter === "Coaching") return coachingExams;
        return exams;
      }, [filter, exams, schoolExams, coachingExams]);

      const activeStats = useMemo(() => calcStats(displayedExams), [displayedExams]);
      const overallStats = useMemo(() => calcStats(exams), [exams]);
      const schoolStats = useMemo(() => calcStats(schoolExams), [schoolExams]);
      const coachingStats = useMemo(() => calcStats(coachingExams), [coachingExams]);

      const getHeaderTitle = () => {
        if (filter === "School") return "School Academic Average";
        if (filter === "Coaching") return "Coaching Academic Average";
        return "Overall Academic Average";
      };

      return (
        <div className="p-4 space-y-4">
          {/* Header & Actions */}
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white">Exam Marks</h1>
              <p className="text-xs text-gray-400 mt-0.5">School & coaching performance tracking</p>
            </div>
            <button
              onClick={() => setShowModal(true)}
              className="px-3 py-1.5 rounded-xl bg-appGreen text-black text-xs font-semibold hover:bg-green-400 transition shadow-lg shadow-green-500/10 flex items-center space-x-1"
            >
              <span>+ Add Test</span>
            </button>
          </div>

          {/* School vs Coaching Filter Segmented Tabs */}
          <div className="flex glass-tile p-1 rounded-xl text-xs">
            <button
              onClick={() => setFilter("all")}
              className={`flex-1 py-1.5 rounded-lg font-medium transition text-center ${
                filter === "all" ? "bg-white/[0.1] text-appGreen shadow-sm" : "text-gray-400 hover:text-white"
              }`}
            >
              All ({exams.length})
            </button>
            <button
              onClick={() => setFilter("School")}
              className={`flex-1 py-1.5 rounded-lg font-medium transition text-center ${
                filter === "School" ? "bg-white/[0.1] text-blue-400 shadow-sm" : "text-gray-400 hover:text-white"
              }`}
            >
              School ({schoolExams.length})
            </button>
            <button
              onClick={() => setFilter("Coaching")}
              className={`flex-1 py-1.5 rounded-lg font-medium transition text-center ${
                filter === "Coaching" ? "bg-white/[0.1] text-emerald-400 shadow-sm" : "text-gray-400 hover:text-white"
              }`}
            >
              Coaching ({coachingExams.length})
            </button>
          </div>

          {/* Academic Overview Radial Card */}
          <div className="p-4 rounded-2xl glass-panel flex items-center justify-between">
            <div className="space-y-1.5">
              <span className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider block">
                {getHeaderTitle()}
              </span>
              <h2 className="text-2xl font-bold text-white font-mono tabular-nums leading-none">
                {activeStats.avgPct.toFixed(1)}%
              </h2>
              <p className="text-xs text-gray-400 font-mono tabular-nums">
                {activeStats.totalObt} / {activeStats.totalMax} total marks ({displayedExams.length} {displayedExams.length === 1 ? "entry" : "entries"})
              </p>

              {/* Sub-breakdown if viewing All */}
              {filter === "all" && (schoolExams.length > 0 || coachingExams.length > 0) && (
                <div className="flex items-center space-x-2 pt-1 text-[10px]">
                  <span className="px-2 py-0.5 rounded-md bg-blue-500/10 border border-blue-500/20 text-blue-300 font-mono">
                    School: {schoolStats.avgPct.toFixed(1)}%
                  </span>
                  <span className="px-2 py-0.5 rounded-md bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 font-mono">
                    Coaching: {coachingStats.avgPct.toFixed(1)}%
                  </span>
                </div>
              )}
            </div>
            <CircularProgress percentage={activeStats.avgPct} size={76} strokeWidth={6.5} label="Avg" />
          </div>

          {/* Exam / Test Cards List */}
          <div className="space-y-3">
            {displayedExams.length === 0 ? (
              <div className="text-center py-10 glass-panel rounded-2xl p-6">
                <p className="text-xs text-gray-400">No {filter === "all" ? "" : filter.toLowerCase() + " "}exams recorded yet.</p>
                <button
                  onClick={() => setShowModal(true)}
                  className="mt-3 px-3 py-1.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.1] text-xs text-gray-300 border border-white/[0.08] transition"
                >
                  Log your first {filter === "Coaching" ? "Coaching" : filter === "School" ? "School" : ""} test
                </button>
              </div>
            ) : (
              displayedExams.map(exam => {
                let examObt = 0, examMax = 0;
                (exam.subjects || []).forEach(s => {
                  examObt += Number(s.obtained) || 0;
                  examMax += Number(s.maxMarks) || 0;
                });
                const pct = examMax > 0 ? (examObt / examMax) * 100 : 0;
                const isCoaching = exam.category === "Coaching";
                const isSingleSubject = (exam.subjects || []).length === 1;

                return (
                  <div key={exam.id} className="p-4 rounded-2xl glass-panel hover:border-white/[0.14] transition space-y-3">
                    <div className="flex items-start justify-between">
                      <div className="space-y-1">
                        <div className="flex items-center space-x-1.5 flex-wrap gap-y-1">
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold border ${
                            isCoaching
                              ? "border-emerald-500/30 text-emerald-400 bg-emerald-500/10"
                              : "border-blue-500/30 text-blue-400 bg-blue-500/10"
                          }`}>
                            {isCoaching ? "Coaching" : "School"}
                          </span>
                          {isSingleSubject && (
                            <span className="text-[10px] px-1.5 py-0.5 rounded-full border border-purple-500/30 text-purple-300 bg-purple-500/10">
                              Single Subject
                            </span>
                          )}
                          <span className="text-[10px] text-gray-500 font-mono">{exam.date}</span>
                        </div>
                        <h3 className="text-sm font-semibold text-white tracking-tight">{exam.name}</h3>
                      </div>
                      <div className="flex items-center space-x-2 shrink-0">
                        <span className="text-xs font-bold font-mono tabular-nums text-appGreen px-2 py-0.5 rounded-full bg-appGreenSubtle border border-appGreen/20">
                          {pct.toFixed(1)}%
                        </span>
                        <button
                          onClick={() => onDeleteExam(exam.id)}
                          className="text-gray-500 hover:text-red-400 text-xs p-1"
                          title="Delete Record"
                        >
                          ✕
                        </button>
                      </div>
                    </div>

                    {/* Subjects breakdown */}
                    <div className="space-y-1.5 pt-2 border-t border-white/[0.04]">
                      {(exam.subjects || []).map((sub, i) => {
                        const subPct = sub.maxMarks > 0 ? (sub.obtained / sub.maxMarks) * 100 : 0;
                        return (
                          <div key={i} className="flex items-center justify-between text-xs py-0.5">
                            <span className="text-gray-300 font-medium">{sub.name}</span>
                            <div className="flex items-center space-x-2">
                              <span className="font-mono text-gray-400 tabular-nums">
                                {sub.obtained} / {sub.maxMarks}
                              </span>
                              <span className="text-[11px] font-mono tabular-nums text-gray-400 w-11 text-right">
                                {subPct.toFixed(0)}%
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {exam.notes && (
                      <p className="text-[11px] text-gray-400 italic pt-1.5 border-t border-white/[0.04]">
                        {exam.notes}
                      </p>
                    )}
                  </div>
                );
              })
            )}
          </div>

          {showModal && (
            <AddExamModal
              defaultCategory={filter === "School" ? "School" : "Coaching"}
              onClose={() => setShowModal(false)}
              onSave={(record) => {
                onAddExam(record);
                setShowModal(false);
              }}
            />
          )}

        </div>
      );
    }

    function AddExamModal({ onClose, onSave, defaultCategory = "Coaching" }) {
      const [mode, setMode] = useState("single"); // "single" | "multi"
      const [category, setCategory] = useState(defaultCategory); // "School" | "Coaching"
      const [date, setDate] = useState(formatDateKey(new Date()));
      const [notes, setNotes] = useState("");

      // Single-subject mode fields
      const [singleSubject, setSingleSubject] = useState("");
      const [singleTitle, setSingleTitle] = useState("");
      const [singleObtained, setSingleObtained] = useState("");
      const [singleMaxMarks, setSingleMaxMarks] = useState("100");

      // Multi-subject mode fields
      const [multiName, setMultiName] = useState("");
      const [multiSubjects, setMultiSubjects] = useState([
        { name: "Mathematics", obtained: "", maxMarks: "100" },
        { name: "Physics", obtained: "", maxMarks: "100" }
      ]);

      const commonSubjects = ["Physics", "Chemistry", "Mathematics", "Biology", "English", "Computer Sci"];

      const addMultiSubjectRow = () => {
        setMultiSubjects([...multiSubjects, { name: "", obtained: "", maxMarks: "100" }]);
      };

      const updateMultiSubject = (idx, field, val) => {
        const copy = [...multiSubjects];
        copy[idx][field] = val;
        setMultiSubjects(copy);
      };

      const removeMultiSubjectRow = (idx) => {
        if (multiSubjects.length <= 1) return;
        setMultiSubjects(multiSubjects.filter((_, i) => i !== idx));
      };

      const handleSubmit = (e) => {
        e.preventDefault();

        if (mode === "single") {
          const sName = singleSubject.trim();
          if (!sName) return;
          const finalTitle = singleTitle.trim() || `${sName} ${category === "Coaching" ? "Test" : "Exam"}`;
          const examRecord = {
            id: "ex_" + Date.now(),
            name: finalTitle,
            category,
            date,
            notes: notes.trim(),
            subjects: [
              {
                name: sName,
                obtained: Number(singleObtained) || 0,
                maxMarks: Number(singleMaxMarks) || 100
              }
            ],
            createdAt: new Date().toISOString()
          };
          onSave(examRecord);
        } else {
          const mTitle = multiName.trim();
          if (!mTitle) return;
          const validSubjects = multiSubjects.filter(s => s.name.trim()).map(s => ({
            name: s.name.trim(),
            obtained: Number(s.obtained) || 0,
            maxMarks: Number(s.maxMarks) || 100
          }));
          if (validSubjects.length === 0) return;

          const examRecord = {
            id: "ex_" + Date.now(),
            name: mTitle,
            category,
            date,
            notes: notes.trim(),
            subjects: validSubjects,
            createdAt: new Date().toISOString()
          };
          onSave(examRecord);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <form
            onSubmit={handleSubmit}
            className="bg-[#121212] border border-white/[0.1] rounded-2xl p-5 max-w-sm w-full space-y-3.5 shadow-2xl max-h-[90vh] overflow-y-auto scrollbar-none"
          >
            {/* Header */}
            <div className="flex items-center justify-between border-b border-white/[0.08] pb-2.5">
              <h3 className="text-sm font-semibold text-white">Log Academic Test / Exam</h3>
              <button type="button" onClick={onClose} className="text-gray-400 hover:text-white text-xs">✕</button>
            </div>

            {/* Mode Switcher: Single-Subject vs Multi-Subject */}
            <div>
              <label className="text-[10px] text-gray-400 uppercase tracking-wider block mb-1">Entry Mode</label>
              <div className="grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-black/60 border border-white/[0.06] text-xs">
                <button
                  type="button"
                  onClick={() => setMode("single")}
                  className={`py-1.5 rounded-lg font-medium transition text-center ${
                    mode === "single" ? "bg-white/[0.12] text-appGreen font-semibold shadow-sm" : "text-gray-400 hover:text-white"
                  }`}
                >
                  ⚡ One per Subject
                </button>
                <button
                  type="button"
                  onClick={() => setMode("multi")}
                  className={`py-1.5 rounded-lg font-medium transition text-center ${
                    mode === "multi" ? "bg-white/[0.12] text-appGreen font-semibold shadow-sm" : "text-gray-400 hover:text-white"
                  }`}
                >
                  📚 Multi-Subject
                </button>
              </div>
            </div>

            {/* Category Selector: School vs Coaching */}
            <div>
              <label className="text-[10px] text-gray-400 uppercase tracking-wider block mb-1">Section / Category</label>
              <div className="grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-black/60 border border-white/[0.06] text-xs">
                <button
                  type="button"
                  onClick={() => setCategory("School")}
                  className={`py-1.5 rounded-lg font-medium transition text-center ${
                    category === "School" ? "bg-blue-500/20 text-blue-300 border border-blue-500/30 font-semibold" : "text-gray-400 hover:text-white"
                  }`}
                >
                  🏫 School
                </button>
                <button
                  type="button"
                  onClick={() => setCategory("Coaching")}
                  className={`py-1.5 rounded-lg font-medium transition text-center ${
                    category === "Coaching" ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-semibold" : "text-gray-400 hover:text-white"
                  }`}
                >
                  🎯 Coaching
                </button>
              </div>
            </div>

            {/* Single Subject Mode Fields */}
            {mode === "single" && (
              <div className="space-y-3 pt-1 border-t border-white/[0.06]">
                <div>
                  <label className="text-[11px] text-gray-400">Subject Name</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Physics, Mathematics, Organic Chemistry"
                    value={singleSubject}
                    onChange={(e) => setSingleSubject(e.target.value)}
                    className="w-full mt-1 p-2.5 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none focus:border-appGreen"
                  />
                  {/* Quick preset chips */}
                  <div className="flex flex-wrap gap-1 mt-1.5">
                    {commonSubjects.map(s => (
                      <button
                        key={s}
                        type="button"
                        onClick={() => setSingleSubject(s)}
                        className={`text-[10px] px-2 py-0.5 rounded-md border transition ${
                          singleSubject === s
                            ? "bg-appGreenSubtle text-appGreen border-appGreen/30"
                            : "bg-white/[0.03] text-gray-400 border-white/[0.06] hover:text-white"
                        }`}
                      >
                        {s}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="text-[11px] text-gray-400">Test Title (Optional)</label>
                  <input
                    type="text"
                    placeholder={singleSubject ? `${singleSubject} Weekly Test` : "e.g. Chapter 4 Quiz, Mock Test #2"}
                    value={singleTitle}
                    onChange={(e) => setSingleTitle(e.target.value)}
                    className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[11px] text-gray-400">Marks Obtained</label>
                    <input
                      type="number"
                      required
                      placeholder="e.g. 45"
                      value={singleObtained}
                      onChange={(e) => setSingleObtained(e.target.value)}
                      className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white font-mono focus:outline-none focus:border-appGreen"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-gray-400">Max Marks</label>
                    <input
                      type="number"
                      required
                      placeholder="e.g. 50 or 100"
                      value={singleMaxMarks}
                      onChange={(e) => setSingleMaxMarks(e.target.value)}
                      className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white font-mono focus:outline-none"
                    />
                  </div>
                </div>
              </div>
            )}

            {/* Multi Subject Mode Fields */}
            {mode === "multi" && (
              <div className="space-y-3 pt-1 border-t border-white/[0.06]">
                <div>
                  <label className="text-[11px] text-gray-400">Exam Title</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Term 1 Board Midterms, Grand Mock Test"
                    value={multiName}
                    onChange={(e) => setMultiName(e.target.value)}
                    className="w-full mt-1 p-2.5 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none focus:border-appGreen"
                  />
                </div>

                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <label className="text-[11px] text-gray-400 font-semibold">Subjects & Scores</label>
                    <button type="button" onClick={addMultiSubjectRow} className="text-xs text-appGreen font-medium hover:underline">
                      + Add Subject
                    </button>
                  </div>

                  {multiSubjects.map((sub, idx) => (
                    <div key={idx} className="flex items-center space-x-1.5">
                      <input
                        type="text"
                        placeholder="Subject"
                        value={sub.name}
                        onChange={(e) => updateMultiSubject(idx, "name", e.target.value)}
                        className="flex-1 p-2 rounded-lg bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                      />
                      <input
                        type="number"
                        placeholder="Obt"
                        value={sub.obtained}
                        onChange={(e) => updateMultiSubject(idx, "obtained", e.target.value)}
                        className="w-16 p-2 rounded-lg bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none text-center font-mono"
                      />
                      <span className="text-gray-500 text-xs">/</span>
                      <input
                        type="number"
                        placeholder="Max"
                        value={sub.maxMarks}
                        onChange={(e) => updateMultiSubject(idx, "maxMarks", e.target.value)}
                        className="w-16 p-2 rounded-lg bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none text-center font-mono"
                      />
                      <button
                        type="button"
                        onClick={() => removeMultiSubjectRow(idx)}
                        className="text-gray-500 hover:text-red-400 text-xs p-1"
                        title="Remove Subject"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Shared Fields: Date & Notes */}
            <div className="space-y-2.5 pt-2 border-t border-white/[0.06]">
              <div>
                <label className="text-[11px] text-gray-400">Date</label>
                <input
                  type="date"
                  value={date}
                  onChange={(e) => setDate(e.target.value)}
                  className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                />
              </div>

              <div>
                <label className="text-[11px] text-gray-400">Reflection / Notes (optional)</label>
                <input
                  type="text"
                  placeholder="Key mistakes, formulas to revise, test duration..."
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                />
              </div>
            </div>

            {/* Modal Actions */}
            <div className="flex space-x-2 pt-2 border-t border-white/[0.06]">
              <button
                type="button"
                onClick={onClose}
                className="flex-1 py-2 text-xs rounded-xl border border-white/[0.08] text-gray-400 hover:text-white transition"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="flex-1 py-2 text-xs rounded-xl bg-appGreen text-black font-semibold hover:bg-green-400 transition"
              >
                Save Record
              </button>
            </div>
          </form>
        </div>
      );
    }

    // ==========================================
    // 7. DATE JOURNAL & SCHEDULE MODAL
    // ==========================================
    function DateJournalModal({ date, journalContent, scheduledForDate, onSaveJournal, onAddScheduled, onDeleteScheduled, onClose }) {
      const [draftContent, setDraftContent] = useState(journalContent);
      const [title, setTitle] = useState("");
      const [time, setTime] = useState("07:30");
      const [details, setDetails] = useState("");

      const handleAddScheduled = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        onAddScheduled({
          id: "sched_" + Date.now(),
          title: title.trim(),
          date: formatDateKey(date),
          time,
          details: details.trim()
        });
        setTitle("");
        setDetails("");
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="bg-[#121212] border border-white/[0.1] rounded-2xl p-5 max-w-sm w-full space-y-4 max-h-[90vh] overflow-y-auto scrollbar-none shadow-2xl">
            <div className="flex items-center justify-between border-b border-white/[0.08] pb-2">
              <div>
                <h3 className="text-sm font-semibold text-white">Daily Entry & Schedule</h3>
                <p className="text-[11px] text-gray-400 mt-0.5">
                  {date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}
                </p>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-xs">✕</button>
            </div>

            {/* Journal Area */}
            <div>
              <label className="text-[11px] font-semibold text-gray-300">Journal & Notes</label>
              <textarea
                value={draftContent}
                onChange={(e) => setDraftContent(e.target.value)}
                placeholder="Write your thoughts, daily learnings, or observations..."
                className="w-full mt-1.5 p-3 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none focus:border-appGreen resize-none h-28 leading-relaxed"
              />
            </div>

            {/* Scheduled Workouts for this date */}
            <div className="space-y-2 pt-2 border-t border-white/[0.06]">
              <label className="text-[11px] font-semibold text-gray-300">Scheduled for this Day</label>
              {scheduledForDate.length > 0 ? (
                <div className="space-y-1.5">
                  {scheduledForDate.map(sw => (
                    <div key={sw.id} className="p-2 rounded-xl glass-tile flex items-center justify-between text-xs">
                      <div>
                        <span className="font-medium text-white">{sw.title}</span>
                        <span className="text-gray-400 ml-2 font-mono">{sw.time}</span>
                      </div>
                      <button onClick={() => onDeleteScheduled(sw.id)} className="text-gray-500 hover:text-red-400 text-xs px-1">✕</button>
                    </div>
                  ))}
                </div>
              ) : (
                <p className="text-[11px] text-gray-500 italic">No workouts scheduled for this date.</p>
              )}

              {/* Quick schedule form */}
              <form onSubmit={handleAddScheduled} className="space-y-2 pt-1">
                <input
                  type="text"
                  placeholder="Workout title (e.g. Upper Hypertrophy)"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                />
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="time"
                    value={time}
                    onChange={(e) => setTime(e.target.value)}
                    className="w-full p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none font-mono"
                  />
                  <input
                    type="text"
                    placeholder="Focus / sets"
                    value={details}
                    onChange={(e) => setDetails(e.target.value)}
                    className="w-full p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full py-2 rounded-xl glass-tile hover:bg-white/[0.08] text-xs text-appGreen font-semibold transition"
                >
                  + Add to this Date
                </button>
              </form>
            </div>

            <button
              onClick={() => {
                onSaveJournal(draftContent);
                onClose();
              }}
              className="w-full py-2.5 text-xs rounded-xl bg-appGreen text-black font-semibold mt-2 hover:bg-green-400 transition"
            >
              Done & Save
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. SETTINGS & PRESETS MODAL
    // ==========================================
    function SettingsModal({ onClose, onExport, onImport, onResetPresets }) {
      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="bg-[#121212] border border-white/[0.1] rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
            <div className="flex items-center justify-between border-b border-white/[0.08] pb-2">
              <h3 className="text-sm font-semibold text-white">Data & Presets</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-xs">✕</button>
            </div>

            <p className="text-xs text-gray-400 leading-relaxed">
              <strong>ARC v2.0</strong> operates completely offline with IndexedDB. No accounts, tracking, or remote telemetry exist.
            </p>

            <div className="space-y-2 pt-1">
              <button
                onClick={() => {
                  onResetPresets();
                  onClose();
                }}
                className="w-full py-2.5 rounded-xl border border-appGreen/40 bg-appGreenSubtle text-appGreen text-xs font-semibold hover:bg-appGreen/20 transition flex items-center justify-center space-x-1.5"
              >
                <span>⚡ Load Curated Presets</span>
              </button>

              <a
                href="/arc-v2.1.bundle"
                download="arc-v2.1.bundle"
                className="w-full py-2.5 rounded-xl bg-white/[0.04] border border-white/[0.08] text-gray-300 text-xs font-medium hover:bg-white/[0.08] hover:text-white transition flex items-center justify-center space-x-1.5"
              >
                <span>📦 Download Git Bundle (v2.1)</span>
              </a>

              <button
                onClick={onExport}
                className="w-full py-2.5 rounded-xl bg-white/[0.06] border border-white/[0.08] text-white text-xs font-medium hover:bg-white/[0.1] transition"
              >
                Export Offline JSON Backup
              </button>

              <label className="w-full py-2.5 rounded-xl border border-white/[0.08] text-gray-300 text-xs font-medium hover:bg-white/[0.06] transition flex items-center justify-center cursor-pointer">
                <span>Restore Backup File</span>
                <input
                  type="file"
                  accept=".json"
                  onChange={onImport}
                  className="hidden"
                />
              </label>
            </div>

            <p className="text-[10px] text-gray-500 text-center">Version 2.1 · github.com/Jitvaraj/Arc</p>
          </div>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
